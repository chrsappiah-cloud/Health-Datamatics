name: iOS CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and unit test
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Select simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_NAME=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1; exit }')
          if [[ -z "${DEVICE_NAME}" ]]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "device=${DEVICE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: ${DEVICE_NAME}"

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Health-Datamatics.xcodeproj \
            -scheme Health-Datamatics \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.device }}"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Health-Datamatics.xcodeproj \
            -scheme Health-Datamatics \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.device }}" \
            -only-testing:Health-DatamaticsTests
